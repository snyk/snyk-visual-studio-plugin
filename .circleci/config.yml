version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1


jobs:
  security-scans:
    resource_class: medium
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - checkout
      - run:
          name: Restore dependencies
          command: dotnet restore
      - prodsec/security_scans:
          mode: auto
          sudo-install: false
          open-source-agentic-fix-enabled: true
          open-source-agentic-fix-base-branch: main
          # --remote-repo-url pins both scans to the Snyk target GitHub Actions' snyk monitor
          # already reports to. Without it, CircleCI's SSH checkout URL resolves to a different
          # remoteUrl and Snyk creates a separate target instead of continuing the existing one.
          open-source-additional-arguments: --exclude=Snyk.VisualStudio.Extension.Tests,Snyk.Common.Tests,Snyk.Code.Library.Tests,Tests --remote-repo-url=http://github.com/snyk/snyk-visual-studio-plugin
          code-additional-arguments: --remote-repo-url=http://github.com/snyk/snyk-visual-studio-plugin
          iac-scan: disabled

workflows:
  version: 2
  CICD:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: team-ide-vuln-alerts
          filters:
            branches:
              ignore: main
      - security-scans:
          context:
            - devex_ide
            - prodsec-orb-runtime

